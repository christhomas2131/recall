name: Bug report
description: Report a reproducible Recall problem using synthetic data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include API keys, tokens, real resumes, or candidate data.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: List the exact steps and use synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, runtime mode, and redacted npm run doctor output.
    validations:
      required: true
